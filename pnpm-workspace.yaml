packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  '@types/node': ^24
  typescript: ^6
  vite: ^6
  vitest: ^4.1.10
  vite-plus: latest
  '@vitest/browser': ^4.1.10
  playwright: ^1.61.1
  '@vitest/browser-playwright': ^4.1.10
  vitest-browser-vue: ^2.1.0
  msw: ^2.15.0
  '@playwright/test': ^1.61.1
  '@axe-core/playwright': ^4.12.1
  knip: ^6.29.0
  size-limit: ^13.0.1
  '@size-limit/preset-app': ^13.0.1
  '@lhci/cli': ^0.15.1
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
allowBuilds:
  esbuild: true
  msw: false
  puppeteer: true
